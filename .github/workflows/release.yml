name: release

# REL.1 — publish the devkit image to GitHub Container Registry on a version tag.
#
# The published image is source-only: no original client `bin/` tree, no pack
# archives and no baked `treecache/`, because those carry licensed Metin2
# content. Consumers fetch them into their own container (`docker run ... fetch`).
#
#     git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/open-mt2/client

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Validate the release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: release tags must look like vX.Y.Z, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build locally first so the proprietary-content gate can inspect the
      # image before anything is pushed.
      - name: Build the source-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          # Assets are fetched by the consumer, never by the published image.
          # The SpeedTree dumper is built from the public speedtreebkr sources.
          build-args: |
            WITH_BIN=0
            WITH_SPEEDTREE=1
            BUILD_SPEEDTREE_DUMPER=1
            BAKE_TREES=0
            SRC_CACHE_BUST=${{ github.run_id }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Refuse to publish proprietary assets
        run: |
          docker run --rm \
            --entrypoint /workspace/scripts/verify-no-proprietary.sh \
            "$IMAGE:$GITHUB_REF_NAME" /workspace

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the version and latest tags
        run: |
          docker tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"
