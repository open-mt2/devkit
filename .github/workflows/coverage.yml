name: coverage

# TA.7 — the per-module coverage ratchet. CI can only see the full 16-package
# tree inside the development image (the package repositories build standalone
# and do not share a coverage baseline), so the image is built here and the
# ratchet runs inside it.
#
# Cost control (#93): this job builds the full image, so it is deliberately not
# run on ordinary pushes or PRs. It runs on release tags and on demand:
#
#     gh workflow run coverage --repo open-mt2/devkit
#
# Restore PR runs once CI cost is re-evaluated (see #93).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Per-module coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ratchet self-test
        run: ./scripts/test-coverage-ratchet.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Assets and the SpeedTree baker are irrelevant to coverage and pull from
      # hosts that are outside the parity scope.
      - name: Build the development image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openmt2/client:ci
          build-args: |
            WITH_BIN=0
            WITH_SPEEDTREE=0
            BUILD_SPEEDTREE_DUMPER=0
            BAKE_TREES=0
            SRC_CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the coverage ratchet
        run: |
          mkdir -p build-coverage coverage
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/scripts:/workspace/scripts" \
            -v "$PWD/golden:/workspace/golden" \
            -v "$PWD/build-coverage:/workspace/build-coverage" \
            -v "$PWD/coverage:/workspace/coverage" \
            openmt2/client:ci coverage --check

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
