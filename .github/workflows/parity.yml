name: parity

# T4.2 — build both targets from the same image, run the tests and compare the
# two distributions. The full image is expensive, so this runs on release tags
# and on demand (same cost policy as the coverage ratchet, see #93).
#
#     gh workflow run parity --repo open-mt2/devkit

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-target:
    name: Linux + Windows
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Devkit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openmt2/client:ci
          # Assets and the SpeedTree baker are irrelevant to the parity build.
          build-args: |
            WITH_BIN=0
            WITH_SPEEDTREE=0
            BUILD_SPEEDTREE_DUMPER=0
            BAKE_TREES=0
            SRC_CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare build directories
        run: mkdir -p build dist dist-windows smoke-artifacts

      - name: Linux build + CTest
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/src:/workspace/src" \
            -v "$PWD/build:/workspace/build" \
            -v "$PWD/dist:/workspace/dist" \
            -v "$PWD/scripts:/workspace/scripts" \
            -v "$PWD/docs:/workspace/docs" \
            -v "$PWD/golden:/workspace/golden" \
            openmt2/client:ci -t --skip-pack

      - name: Windows cross-build
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e OPENMT2_DIST_DIR=/workspace/dist-windows \
            -v "$PWD/src:/workspace/src" \
            -v "$PWD/build:/workspace/build" \
            -v "$PWD/dist-windows:/workspace/dist-windows" \
            -v "$PWD/scripts:/workspace/scripts" \
            openmt2/client:ci windows --skip-pack

      - name: Compare the two distributions
        run: python3 scripts/dist-diff.py dist dist-windows

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: parity-dist
          path: |
            dist/
            dist-windows/
          if-no-files-found: error
