name: base

# BASE.1 — publish the devkit toolchain base image.
#
# The client image (dockerfile) is a thin `FROM ghcr.io/open-mt2/devkit-base`,
# so the expensive, rarely-changing layers (Debian toolchain, CPython 2.7,
# Windows cross-deps) are built here once and pulled by every other build.
#
# Rebuild triggers: changes to the base recipe or to the scripts it runs.
# Run manually with `gh workflow run base`.

on:
  push:
    branches: [main]
    paths:
      - dockerfile.base
      - scripts/build-windows-deps.sh
      - scripts/fetch-windows-python.sh
      - .github/workflows/base.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: base-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_IMAGE: ghcr.io/open-mt2/devkit-base

jobs:
  publish:
    name: Build and publish the toolchain base
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute a date tag
        id: tags
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile.base
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:bookworm
            ${{ env.BASE_IMAGE }}:bookworm-${{ steps.tags.outputs.date }}
          labels: |
            org.opencontainers.image.version=bookworm-${{ steps.tags.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=devkit-base
          cache-to: type=gha,mode=max,scope=devkit-base
